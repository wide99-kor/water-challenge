name: Keep Supabase Alive
 
on:
  schedule:
    - cron: '0 3 * * 1,4'   # 매주 월/목 오전 12시(KST) 실행 — 7일 정지 기준보다 넉넉한 간격
  workflow_dispatch:        # 필요하면 Actions 탭에서 수동 실행도 가능
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://qxzqcifxxzaijliyjsld.supabase.co/rest/v1/employees?select=id&limit=1" \
            -H "apikey: sb_publishable_M5fD5lXVN0ssLEBzS7L7rQ_J2QcAsLU" \
            -H "Authorization: Bearer sb_publishable_M5fD5lXVN0ssLEBzS7L7rQ_J2QcAsLU"
