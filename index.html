<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>물 마시기 챌린지</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f3f7fb;color:#183044}
.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #18304412}
h1,h2,p{margin-top:0}.login{max-width:420px;margin:9vh auto}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#667;margin-bottom:5px}
input,button,select{width:100%;padding:13px;border-radius:11px;border:1px solid #d6e0e8;font-size:15px}button{background:#1677ff;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef4f8;color:#183044}
.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{width:auto;padding:8px 12px;background:#eef4f8;color:#183044}
.progress{height:18px;background:#e9eff4;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2b9cff;width:0;transition:.3s}
.count{text-align:center;font-size:44px;font-weight:800;margin:10px 0}.sub{text-align:center;color:#667}
.auth{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.auth div{text-align:center;padding:10px 2px;border-radius:10px;background:#edf2f6;font-size:18px}.auth .on{background:#cfeaff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:center}th{background:#f7f9fb;position:sticky;top:0}
.ok{color:#087f45;font-weight:700}.warn{color:#d77a00;font-weight:700}.small{font-size:12px;color:#71808d}.msg{padding:10px;border-radius:10px;background:#fff5d9;margin-top:10px}
.error{background:#ffe8e8;color:#a11}.loading{opacity:.65;pointer-events:none}
@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}.auth{grid-template-columns:repeat(5,1fr)}table{font-size:11px}th,td{padding:7px 3px}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// =========================================
// Supabase 연결 정보
// publishable key는 브라우저에서 사용하는 공개 키입니다.
// Service role key는 절대 넣지 마세요.
// =========================================
const SUPABASE_URL = "https://qxzqcifxxzaijliyjsld.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_M5fD5lXVN0ssLEBzS7L7rQ_J2QcAsLU";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// 현재 테스트 단계에서는 water01만 Supabase Auth 계정이 만들어져 있습니다.
// 나머지 직원은 Auth 계정을 만든 뒤 아래 목록에 같은 형식으로 추가하면 됩니다.
const USERS = [
 {id:"water01",name:"김민수",dept:"생산팀",email:"water01@test.com"},
 {id:"water02",name:"이준호",dept:"품질팀",email:"water02@test.com"},
 {id:"water03",name:"박지훈",dept:"생산팀",email:"water03@test.com"},
 {id:"water04",name:"최현우",dept:"기술팀",email:"water04@test.com"},
 {id:"water05",name:"정우진",dept:"관리팀",email:"water05@test.com"},
 {id:"water06",name:"한지민",dept:"품질팀",email:"water06@test.com"},
 {id:"water07",name:"서준혁",dept:"생산팀",email:"water07@test.com"},
 {id:"water08",name:"윤서연",dept:"기술팀",email:"water08@test.com"},
 {id:"water09",name:"강도윤",dept:"생산팀",email:"water09@test.com"},
 {id:"water10",name:"임채원",dept:"관리팀",email:"water10@test.com"}
];

let currentEmployee = null;
let currentRecords = [];

function $(id){return document.getElementById(id)}
function todayKST(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function startOfTodayKST(){ return new Date(todayKST()+"T00:00:00+09:00").toISOString(); }
function startOfTomorrowKST(){
  const d=new Date(todayKST()+"T00:00:00+09:00");
  d.setUTCDate(d.getUTCDate()+1);
  return d.toISOString();
}
function formatTime(value){
  return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value));
}
function monthRangeKST(){
  const now=new Date();
  const y=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric'}).format(now);
  const m=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',month:'2-digit'}).format(now);
  const first=`${y}-${m}-01T00:00:00+09:00`;
  const d=new Date(first); d.setUTCMonth(d.getUTCMonth()+1);
  return {start:new Date(first).toISOString(),end:d.toISOString(),year:Number(y),month:Number(m)};
}

function loginPage(msg=""){
 app.innerHTML=`<div class="wrap login"><div class="card">
 <h1>💧 물 마시기 챌린지</h1>
 <p class="small">Supabase 연동 테스트 버전</p>
 <div class="field"><label>아이디</label><input id="uid" placeholder="water01" autocomplete="username"></div>
 <div class="field"><label>비밀번호</label><input id="pw" type="password" placeholder="Supabase Auth 비밀번호" autocomplete="current-password"></div>
 <button id="loginBtn" onclick="login()">로그인</button>
 ${msg?`<div class="msg error">${msg}</div>`:""}
 <p class="small" style="margin-top:14px">현재 테스트 가능한 계정: <b>water01</b></p>
 </div></div>`;
}

async function login(){
 const id=$('uid').value.trim();
 const pw=$('pw').value;
 const u=USERS.find(x=>x.id===id);
 if(!u){loginPage("등록되지 않은 아이디입니다. 현재는 water01만 Auth 테스트가 가능합니다.");return;}
 const btn=$('loginBtn'); btn.classList.add('loading'); btn.textContent='로그인 중...';
 const {error}=await supabaseClient.auth.signInWithPassword({email:u.email,password:pw});
 if(error){btn.classList.remove('loading');btn.textContent='로그인';loginPage("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");return;}
 await loadCurrentEmployee();
}

async function loadCurrentEmployee(){
 const {data:{user},error:authError}=await supabaseClient.auth.getUser();
 if(authError||!user){loginPage();return;}
 const {data,error}=await supabaseClient.from('employees').select('id,login_id,name,department,role,auth_user_id').eq('auth_user_id',user.id).maybeSingle();
 if(error){loginPage('직원 정보를 불러오지 못했습니다: '+error.message);return;}
 if(!data){await supabaseClient.auth.signOut();loginPage('Supabase Auth 계정과 직원 정보가 연결되지 않았습니다.');return;}
 currentEmployee=data;
 await userPage();
}

async function userPage(){
 const {data,error}=await supabaseClient.from('water_records').select('id,employee_id,drank_at,photo_path').eq('employee_id',currentEmployee.id).gte('drank_at',startOfTodayKST()).lt('drank_at',startOfTomorrowKST()).order('drank_at',{ascending:true});
 if(error){app.innerHTML=`<div class="wrap"><div class="card"><div class="msg error">기록을 불러오지 못했습니다: ${error.message}</div></div></div>`;return;}
 currentRecords=data||[];
 const n=currentRecords.length;
 app.innerHTML=`<div class="wrap">
 <div class="top"><div><b>💧 물 마시기 챌린지</b><div class="small">${currentEmployee.name} · ${currentEmployee.department}</div></div><button class="logout" onclick="logout()">로그아웃</button></div>
 <div class="card">
 <h2>오늘의 물 마시기</h2><p class="sub">${todayKST()}</p>
 <div class="count"><span id="cnt">${n}</span> / 10회</div>
 <div class="progress"><div class="bar" id="bar" style="width:${Math.min(n*10,100)}%"></div></div>
 <div class="auth">${Array.from({length:10},(_,i)=>`<div class="${i<n?'on':''}">${i<n?'💧':'○'}</div>`).join('')}</div>
 <button id="certBtn" style="margin-top:18px" onclick="certify()">📷 물 마시고 인증하기</button>
 <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
 <p class="small" style="margin-top:12px">현재 1차 테스트는 인증 횟수와 시간을 Supabase DB에 저장합니다. 사진 파일 자체의 Storage 업로드는 다음 단계에서 연결합니다.</p>
 <div id="notice"></div>
 </div>
 <div class="card"><h2>이번 달 기록</h2><div id="month">불러오는 중...</div></div>
 </div>`;
 renderMonth();
}

async function certify(){
 if(currentRecords.length>=10){$('notice').innerHTML='<div class="msg">오늘 목표 10회를 달성했습니다! 🎉</div>';return;}
 const btn=$('certBtn');
 btn.disabled=true;btn.textContent='사진 선택 중...';
 const photo=$('photo');
 photo.value='';
 photo.onchange=async()=>{
   const file=photo.files[0];
   if(!file){btn.disabled=false;btn.textContent='📷 물 마시고 인증하기';return;}
   btn.textContent='저장 중...';
   const {error}=await supabaseClient.from('water_records').insert({
     employee_id:currentEmployee.id,
     drank_at:new Date().toISOString(),
     photo_path:file.name
   });
   if(error){
     btn.disabled=false;btn.textContent='📷 물 마시고 인증하기';
     $('notice').innerHTML='<div class="msg error">저장 실패: '+error.message+'</div>';
     return;
   }
   await userPage();
 };
 photo.click();
}

async function renderMonth(){
 const range=monthRangeKST();
 const {data,error}=await supabaseClient.from('water_records').select('drank_at').eq('employee_id',currentEmployee.id).gte('drank_at',range.start).lt('drank_at',range.end).order('drank_at',{ascending:true});
 if(error){$('month').innerHTML='<div class="msg error">월간 기록을 불러오지 못했습니다.</div>';return;}
 const byDay={};
 (data||[]).forEach(r=>{
   const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.drank_at));
   byDay[ds]=(byDay[ds]||0)+1;
 });
 const last=new Date(range.year,range.month,0).getDate();
 const days=[];
 for(let day=1;day<=last;day++){
   const ds=`${range.year}-${String(range.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
   const n=byDay[ds]||0;
   days.push(`<tr><td>${ds}</td><td class="${n>=10?'ok':n>0?'warn':''}">${n}/10</td></tr>`);
 }
 $('month').innerHTML=`<table><tr><th>날짜</th><th>인증</th></tr>${days.join('')}</table>`;
}

async function logout(){
 await supabaseClient.auth.signOut();
 currentEmployee=null;currentRecords=[];loginPage();
}

async function boot(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(session) await loadCurrentEmployee(); else loginPage();
}

boot();
</script>
</body></html>
