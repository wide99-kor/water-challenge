const SIGNED_URL_EXPIRES = 60 * 60; // 사진 보기용 임시 URL: 1시간
const signedUrlCache = new Map();

async function photoUrl(path){
  if(!path) return "";
  const cached = signedUrlCache.get(path);
  if(cached && cached.expiresAt > Date.now() + 60 * 1000) return cached.url;

  const {data,error}=await supabaseClient.storage
    .from(PHOTO_BUCKET)
    .createSignedUrl(path,SIGNED_URL_EXPIRES);

  if(error || !data?.signedUrl){
    console.error('사진 Signed URL 생성 실패:', error);
    return "";
  }

  signedUrlCache.set(path,{
    url:data.signedUrl,
    expiresAt:Date.now() + SIGNED_URL_EXPIRES * 1000
  });
  return data.signedUrl;
}

async function getSignedPhotoUrls(records){
  const paths=[...new Set((records||[]).map(r=>r.photo_path).filter(Boolean))];
  const pairs=await Promise.all(paths.map(async path=>[path,await photoUrl(path)]));
  return Object.fromEntries(pairs);
}

let photoModalHistoryOpen=false;

function openPhotoModal(url){
  if(!url) return;
  const modal=$("photoModal");
  const img=$("photoModalImg");
  img.src=url;
  modal.classList.add("show");
  document.body.style.overflow="hidden";

  if(!photoModalHistoryOpen){
    photoModalHistoryOpen=true;
    history.pushState({photoModal:true},"");
  }
}

function closePhotoModal(event, fromPopState=false){
  if(event && event.target && event.target.id!=="photoModal" && event.target.id!=="photoModalImg") return;

  const modal=$("photoModal");
  const img=$("photoModalImg");
  if(!modal.classList.contains("show")) return;

  modal.classList.remove("show");
  document.body.style.overflow="";
  setTimeout(()=>{ if(!modal.classList.contains("show")) img.src=""; },140);

  if(photoModalHistoryOpen){
    photoModalHistoryOpen=false;
    if(!fromPopState) history.back();
  }
}

window.addEventListener("popstate",function(){
  if(photoModalHistoryOpen){
    closePhotoModal(null,true);
  }
});

document.addEventListener("keydown",function(e){

function monthRangeKST(){
  const now=new Date();
  const y=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric'}).format(now);
  const m=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',month:'2-digit'}).format(now);
  const first=`${y}-${m}-01T00:00:00+09:00`;
  const d=new Date(first); d.setUTCMonth(d.getUTCMonth()+1);
  return {start:new Date(first).toISOString(),end:d.toISOString(),year:Number(y),month:Number(m)};
}

async function login(){
 const id=$('uid').value.trim();
 const pw=$('pw').value;
 if(!id||!pw){loginPage("아이디와 비밀번호를 입력해주세요.");return;}
 const btn=$('loginBtn'); btn.classList.add('loading'); btn.textContent='로그인 중...';

 // 직원 로그인 ID와 Supabase Auth 이메일을 분리해서 사용합니다.
 // auth_email이 비어 있는 기존 계정은 RPC에서 아이디@test.com으로 처리합니다.
 const {data:authEmail,error:emailError}=await supabaseClient
   .rpc('get_auth_email_by_login_id',{p_login_id:id});

 if(emailError || !authEmail){
   btn.classList.remove('loading');
   btn.textContent='로그인';
   loginPage("아이디를 찾을 수 없습니다.");
   return;
 }

 const {error}=await supabaseClient.auth.signInWithPassword({
   email:authEmail,
   password:pw
 });
 if(error){btn.classList.remove('loading');btn.textContent='로그인';loginPage("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");return;}
 await loadCurrentEmployee();
}

async function updatePassword(){
 const pw=$('newPw').value;
 const confirm=$('newPwConfirm').value;
 if(!pw||!confirm){resetPasswordPage('새 비밀번호를 모두 입력해주세요.');return;}
 if(pw.length < 6){resetPasswordPage('비밀번호는 6자 이상 입력해주세요.');return;}
 if(pw !== confirm){resetPasswordPage('두 비밀번호가 일치하지 않습니다.');return;}

 const btn=$('resetPwBtn');
 btn.disabled=true;
 btn.classList.add('loading');
 btn.textContent='변경 중...';

 const {error}=await supabaseClient.auth.updateUser({password:pw});
 if(error){
   btn.disabled=false;
   btn.classList.remove('loading');
   btn.textContent='비밀번호 변경';
   resetPasswordPage('비밀번호 변경에 실패했습니다: '+error.message);
   return;
 }

 await supabaseClient.auth.signOut();
 history.replaceState(null,"",window.location.pathname+window.location.search);
 loginPage('비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.');
}

function validateSetupPasswordMatch(){

async function completeAccountSetup(){
  const changeId=!$('newIdField').classList.contains('hidden');
  const loginId=changeId ? $('setupLoginId').value.trim() : currentEmployee.login_id;
  const pw=$('setupPw').value, confirm=$('setupPwConfirm').value, code=$('setupRecoveryCode').value;
  if(!loginId){accountSetupPage('새 아이디를 입력해주세요.');return;}
  if(pw.length<6){accountSetupPage('비밀번호는 6자 이상 입력해주세요.');return;}
  if(pw!==confirm){validateSetupPasswordMatch();$('setupPwMismatch')?.classList.remove('hidden');return;}
  if(!/^[A-Za-z0-9_-]{3,30}$/.test(loginId)){accountSetupPage('아이디는 영문/숫자/_/- 3~30자로 입력해주세요.');return;}
  const btn=$('setupBtn'); btn.disabled=true; btn.classList.add('loading'); btn.textContent='설정 중...';
  const {data,error}=await supabaseClient.functions.invoke('account-setup',{body:{login_id:loginId,password:pw,recovery_code:code}});
  if(error||!data?.ok){
    btn.disabled=false;btn.classList.remove('loading');btn.textContent='계정 설정 완료';
    let detail=data?.error||'';
    if(error){
      detail += (detail?' / ':'') + (error.message||'Edge Function 호출 실패');
      if(error.context){
        try{
          const body=await error.context.json();
          if(body?.error) detail += ' / 서버: '+body.error;
          else if(body) detail += ' / 서버응답: '+JSON.stringify(body);
        }catch(_){}
      }
    }
    accountSetupPage(detail||'계정 설정에 실패했습니다.');
    return;
  }
  await supabaseClient.auth.signOut(); currentEmployee=null; loginPage('계정 설정이 완료되었습니다. 새 아이디와 비밀번호로 로그인해주세요.',true);
}

async function recoverPassword(){
  const loginId=$('recoverLoginId').value.trim(), code=$('recoverCode').value;
  if(!loginId){forgotPasswordPage('아이디를 입력해주세요.');return;}
  const btn=$('recoverBtn'); btn.disabled=true; btn.classList.add('loading'); btn.textContent='확인 중...';

  const {data,error}=await supabaseClient.functions.invoke('password-recovery',{
    body:{login_id:loginId,recovery_code:code}
  });

  if(error||!data?.ok){
    btn.disabled=false;
    btn.classList.remove('loading');
    btn.textContent='임시 비밀번호 받기';

    let serverData=data;
    if(error?.context){
      try{
        const body=await error.context.json();
        if(body) serverData=body;
      }catch(_){}
    }

    console.error('password-recovery 호출 오류:',{error,data,serverData});

    if(serverData?.code==='INVALID_RECOVERY_CODE'){
      forgotPasswordPage('일치하지 않는 인증코드입니다.');
      return;
    }
    if(serverData?.code==='PASSWORD_RESET_COOLDOWN'){
      forgotPasswordPage(serverData.error||'임시 비밀번호는 3분에 한 번만 발급할 수 있습니다.');
      return;
    }
    if(serverData?.code==='TOO_MANY_ATTEMPTS'){
      forgotPasswordPage(serverData.error||'인증 시도가 너무 많습니다. 15분 후 다시 시도해주세요.');
      return;
    }

    let detail=[];
    if(error){
      detail.push('message: '+(error.message||''));
      if(error.name) detail.push('name: '+error.name);
      const ctx=error.context;
      if(ctx){
        if(typeof ctx.status==='number') detail.push('status: '+ctx.status);
        if(ctx.statusText) detail.push('statusText: '+ctx.statusText);
      }
    }
    if(serverData && typeof serverData==='object') detail.push('server: '+JSON.stringify(serverData));
    const detailText=detail.join('\n');
    forgotPasswordPage(
      '임시 비밀번호 발급에 실패했습니다.'+
      (detailText?'\n\n[상세 오류]\n'+detailText:'')
    );
    return;
  }

  app.innerHTML='<div class="wrap login"><div class="card">'+
    '<h1>💧 물 마시기 챌린지</h1><div class="app-version">'+APP_VERSION+'</div>'+

    '<p class="small" style="text-align:center">본인 확인이 완료되었습니다.</p>'+
    '<div class="msg" style="margin-top:16px"><div><b>아이디</b></div><div style="font-size:18px;margin-top:4px">'+escapeHtml(data.login_id)+'</div>'+
    '<div style="margin-top:12px"><b>임시 비밀번호</b></div><div style="font-size:20px;letter-spacing:1px;margin-top:4px;word-break:break-all">'+escapeHtml(data.temporary_password)+'</div></div>'+

async function optimizePhoto(file){
  // 인증용 사진은 원본 보관이 목적이 아니므로 브라우저에서 먼저 압축합니다.
  // 1차: 최대 900px / JPEG 품질 0.62 / 약 100KB 목표
  // 2차: 720px / 품질 0.50 / 약 130KB 절대 상한
  try{
    const bitmap=await createImageBitmap(file);
    let maxSize=900;
    let quality=0.62;

    async function makeBlob(maxDim,q){
      const scale=Math.min(1,maxDim/Math.max(bitmap.width,bitmap.height));
      const w=Math.max(1,Math.round(bitmap.width*scale));
      const h=Math.max(1,Math.round(bitmap.height*scale));
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d',{alpha:false});
      ctx.drawImage(bitmap,0,0,w,h);
      return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q));
    }

    let blob=await makeBlob(maxSize,quality);
    if(!blob){ bitmap.close(); return file; }

    if(blob.size > PHOTO_TARGET_MAX_BYTES){
      blob=await makeBlob(800,0.55);
    }
    if(blob && blob.size > PHOTO_HARD_MAX_BYTES){
      blob=await makeBlob(720,0.45);
    }

    bitmap.close();
    if(!blob) return file;
    return new File([blob], 'water.jpg', {type:'image/jpeg', lastModified:Date.now()});
  }catch(e){
    console.warn('사진 압축 실패, 원본을 사용합니다.',e);
    return file;
  }
}

function formatBytes(bytes){
  if(!Number.isFinite(bytes)) return '-';
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(2)+' MB';
}

async function cleanupOldPhotos(showMessage=false){
  if(!currentEmployee || currentEmployee.role!=='admin') return {deleted:0,failed:0};

  const cutoff=new Date(Date.now()-PHOTO_RETENTION_DAYS*24*60*60*1000).toISOString();
  let deleted=0, failed=0;

  // 1,000건 제한 때문에 오래된 기록이 남는 문제가 생기지 않도록,
  // 항상 가장 오래된 사진부터 최대 500건씩 반복 정리합니다.
  while(true){
    const {data:oldRecords,error}=await supabaseClient
      .from('water_records')
      .select('id,photo_path,drank_at')
      .lt('drank_at',cutoff)
      .not('photo_path','is',null)
      .order('drank_at',{ascending:true})
      .limit(500);

    if(error){
      console.error('오래된 사진 조회 실패:',error);
      if(showMessage) alert('오래된 사진 정리 조회에 실패했습니다.\n'+error.message);
      return {deleted,failed,error};
    }
    if(!oldRecords || oldRecords.length===0) break;

    for(let i=0;i<oldRecords.length;i+=50){
      const batchRecords=oldRecords.slice(i,i+50);
      const batch=batchRecords.map(r=>r.photo_path).filter(Boolean);
      if(!batch.length) continue;

      const {error:removeError}=await supabaseClient.storage.from(PHOTO_BUCKET).remove(batch);
      if(removeError){
        failed+=batch.length;
        console.error('오래된 사진 삭제 실패:',removeError);
        continue;
      }

      const ids=batchRecords.map(r=>r.id);
      const {error:updateError}=await supabaseClient
        .from('water_records')
        .update({photo_path:null})
        .in('id',ids);
      if(updateError){
        failed+=ids.length;
        console.error('사진 경로 정리 실패:',updateError);
      }else{
        deleted+=ids.length;
      }
    }

    // 실패한 건은 계속 남아 있을 수 있으므로 무한 반복을 막습니다.
    if(oldRecords.length<500) break;
    if(failed>0) break;
  }

  if(showMessage){
    alert(`14일 지난 사진 정리 완료\n삭제: ${deleted}개\n실패: ${failed}개`);
  }
  return {deleted,failed};
}

async function getStorageUsageEstimate(){
  // Storage API에서 직원 폴더별 파일 목록을 읽어 실제 파일 크기를 합산합니다.
  // 이 기능은 관리자 계정의 storage.objects SELECT 정책이 필요합니다.
  try{
    const {data:emps,error:empError}=await supabaseClient
      .from('employees').select('login_id').not('login_id','is',null);
    if(empError) throw empError;
    let total=0, count=0;
    for(const emp of (emps||[])){
      let offset=0;
      while(true){
        const {data, error}=await supabaseClient.storage.from(PHOTO_BUCKET).list(emp.login_id,{limit:100,offset});
        if(error) throw error;
        if(!data || data.length===0) break;
        for(const item of data){
          // list()의 metadata.size가 제공되는 경우만 실제 크기를 합산합니다.
          const size=Number(item.metadata?.size || item.metadata?.['size'] || 0);
          total+=Number.isFinite(size)?size:0;
          if(item.id || item.name) count++;
        }
        if(data.length<100) break;
        offset+=100;
      }
    }
    return {bytes:total,count};
  }catch(e){
    console.warn('Storage 사용량 조회 실패:',e);
    return {bytes:null,count:null,error:e};
  }
}

async function renderStorageStatus(){
  const el=$('storageStatus');
  if(!el) return;
  el.textContent='Storage 사용량 확인 중...';
  let usage;
  if(storageStatusCache.value && Date.now()-storageStatusCache.at < 5*60*1000){
    usage=storageStatusCache.value;
  }else{
    usage=await getStorageUsageEstimate();
    storageStatusCache={at:Date.now(),value:usage};
  }
  if(usage.bytes===null){
    el.innerHTML='⚠️ Storage 사용량을 확인할 수 없습니다. <span class="small">관리자 Storage 조회 권한을 확인하세요.</span>';
    return;
  }
  const pct=(usage.bytes/(1024*1024*1024))*100;
  const safePct=(usage.bytes/STORAGE_SAFE_LIMIT_BYTES)*100;
  let state='정상';
  if(usage.bytes>=STORAGE_SAFE_LIMIT_BYTES) state='⚠️ 안전선 초과';
  else if(usage.bytes>=STORAGE_SAFE_LIMIT_BYTES*0.9) state='주의';
  el.innerHTML=`Storage 약 <b>${formatBytes(usage.bytes)}</b> / 1 GB · 파일 ${usage.count}개 · ${state}<br><span class="small">운영 안전선 ${formatBytes(STORAGE_SAFE_LIMIT_BYTES)} (${safePct.toFixed(0)}%) · 14일 지난 사진은 관리자 화면 진입 시 자동 정리</span>`;
}

async function deleteOwnRecord(recordId){
  const record = currentRecords.find(r=>r.id===Number(recordId));
  if(!record) return;

  if(!confirm('이 인증 기록을 삭제할까요?\n사진과 인증 기록이 함께 삭제됩니다.')) return;

  const {error:deleteError}=await supabaseClient
    .from('water_records')
    .delete()
    .eq('id',Number(recordId))
    .eq('employee_id',currentEmployee.id);

  if(deleteError){
    alert('기록 삭제 실패: '+deleteError.message);
    return;
  }

  if(record.photo_path){
    const {error:photoError}=await supabaseClient
      .storage.from(PHOTO_BUCKET)

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function addDaysKST(dateStr, delta){
  const d=new Date(dateStr+'T00:00:00+09:00');
  d.setUTCDate(d.getUTCDate()+delta);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}

async function fetchTrendRecords(startIso,endIso){
  const rows=[];
  const pageSize=1000;
  let from=0;
  while(true){
    const {data,error}=await supabaseClient
      .from('water_records')
      .select('employee_id,drank_at')
      .gte('drank_at',startIso)
      .lt('drank_at',endIso)
      .order('drank_at',{ascending:true})
      .range(from,from+pageSize-1);
    if(error) throw error;
    const batch=data||[];
    rows.push(...batch);
    if(batch.length<pageSize) break;
    from+=pageSize;
  }
  return rows;
}

function renderTrendChart(data, metric, days){
  const box=$('trendChart');
  if(!box) return;
  if(!data.length){
    box.innerHTML='<div class="trend-empty">선택한 기간에 인증 기록이 없습니다.</div>';
    return;
  }

  const W=760,H=220,L=38,R=16,T=18,B=34;
  const PW=W-L-R, PH=H-T-B;
  const vals=data.map(d=>d.value);
  const max=Math.max(...vals,1);
  const min=Math.min(0,...vals);
  const range=Math.max(max-min,1);
  const x=i=>L+(data.length===1?PW/2:(i/(data.length-1))*PW);
  const y=v=>T+PH-((v-min)/range)*PH;
  const line=data.map((d,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(d.value).toFixed(1)}`).join(' ');
  const area=`M ${x(0).toFixed(1)} ${T+PH} L ${data.map((d,i)=>`${x(i).toFixed(1)} ${y(d.value).toFixed(1)}`).join(' L ')} L ${x(data.length-1).toFixed(1)} ${T+PH} Z`;
  const gridVals=[max,Math.round(max*.5),0];
  const grid=gridVals.map(v=>{
    const yy=y(v);
    return `<line class="trend-grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/><text class="trend-axis" x="${L-7}" y="${(yy+3).toFixed(1)}" text-anchor="end">${v}</text>`;
  }).join('');

  const labelIdx=[];
  const target=Math.min(6,data.length);
  if(data.length<=target){ for(let i=0;i<data.length;i++) labelIdx.push(i); }
  else {
    for(let i=0;i<target;i++) labelIdx.push(Math.round(i*(data.length-1)/(target-1)));
  }
  const labels=labelIdx.map(i=>`<text class="trend-axis" x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${data[i].label}</text>`).join('');
  const metricUnit=metric==='rate'?'%':metric==='participants'?'명':'회';
  const metricName=metric==='rate'?'참여율':metric==='participants'?'참여 인원':'총 인증';
  const dots=data.map((d,i)=>`<circle class="trend-dot" data-index="${i}" cx="${x(i).toFixed(1)}" cy="${y(d.value).toFixed(1)}" r="3"/>`).join('');
  const hitRects=data.map((d,i)=>{
    const left=i===0?L:((x(i-1)+x(i))/2);
    const right=i===data.length-1?W-R:((x(i)+x(i+1))/2);
    return `<rect class="trend-hit" data-index="${i}" x="${left.toFixed(1)}" y="0" width="${Math.max(1,right-left).toFixed(1)}" height="${H}"/>`;
  }).join('');

  box.innerHTML=`<svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="인증 추이 그래프">
    ${grid}<path class="trend-area" d="${area}"/><path class="trend-line" d="${line}"/>${dots}${labels}${hitRects}
  </svg><div class="trend-tooltip" id="trendTooltip"></div>`;

  const tooltip=$('trendTooltip');
  const svg=box.querySelector('svg');
  const showPoint=(idx)=>{
    const d=data[idx];
    if(!d || !tooltip || !svg) return;
    tooltip.innerHTML=`<strong>${d.label}</strong><span>${metricName} ${d.value}${metricUnit}</span>`;
    tooltip.style.display='block';
    const rect=svg.getBoundingClientRect();
    const chartRect=box.getBoundingClientRect();
    const px=(x(idx)/W)*rect.width;
    const py=(y(d.value)/H)*rect.height;
    const tw=tooltip.offsetWidth||130;
    let left=(rect.left-chartRect.left)+px-tw/2;
    left=Math.max(6,Math.min(left,chartRect.width-tw-6));
    let top=(rect.top-chartRect.top)+py-tooltip.offsetHeight-12;
    if(top<6) top=(rect.top-chartRect.top)+py+12;
    tooltip.style.left=left+'px';
    tooltip.style.top=top+'px';
    box.querySelectorAll('.trend-dot').forEach(el=>el.classList.toggle('active',Number(el.dataset.index)===idx));
  };
  const hidePoint=()=>{
    if(tooltip) tooltip.style.display='none';
    box.querySelectorAll('.trend-dot').forEach(el=>el.classList.remove('active'));
  };
  box.querySelectorAll('.trend-hit').forEach(hit=>{
    const idx=Number(hit.dataset.index);
    hit.addEventListener('mouseenter',()=>showPoint(idx));
    hit.addEventListener('mousemove',()=>showPoint(idx));
    hit.addEventListener('click',()=>showPoint(idx));
  });
  box.addEventListener('mouseleave',hidePoint);
  const latest=data[data.length-1];
  const total=data.reduce((sum,d)=>sum+d.value,0);
  const avg=total/data.length;
  const sumEl=$('trendSummary');
  if(sumEl){
    sumEl.innerHTML=`<strong>${latest.value}${metricUnit}</strong><span>선택 기간 마지막 일자 · 일평균 ${avg.toFixed(metric==='rate'?1:1)}${metricUnit}</span>`;
  }
  const note=$('trendNote');
  if(note) note.textContent=`${days===7?'최근 7일':days===14?'최근 14일':days===30?'최근 1개월':'최근 3개월'} · ${metric==='certs'?'전체 인증 횟수':metric==='participants'?'인증 참여 인원':'직원 참여율'}`;
}

async function loadAdminTrend(days=currentTrendDays, metric=currentTrendMetric){
  const token=++trendRequestToken;
  const box=$('trendChart');
  if(box) box.innerHTML='<div class="trend-empty">추이 데이터를 불러오는 중...</div>';
  const endDate=currentAdminDate || todayKST();
  const startDate=addDaysKST(endDate,-(days-1));
  const nextDate=addDaysKST(endDate,1);
  try{
    const records=await fetchTrendRecords(
      new Date(startDate+'T00:00:00+09:00').toISOString(),
      new Date(nextDate+'T00:00:00+09:00').toISOString()
    );
    if(token!==trendRequestToken) return;

    const employees=window.__adminEmployees||[];
    const allowedIds=new Set(
      employees
        .filter(e=>currentAdminCategory==='전체' || (e.category||'사무실')===currentAdminCategory)
        .filter(e=>currentAdminDepartment==='전체' || e.department===currentAdminDepartment)
        .map(e=>e.id)
    );
    const filtered=records.filter(r=>allowedIds.has(r.employee_id));
    const byDay={};
    for(let i=0;i<days;i++){
      const ds=addDaysKST(startDate,i);
      byDay[ds]={certs:0,employees:new Set()};
    }
    filtered.forEach(r=>{
      const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.drank_at));
      if(byDay[ds]){byDay[ds].certs++;byDay[ds].employees.add(r.employee_id);}
    });

    // 참여율/달성 인원은 일별로 직원 수를 기준으로 계산합니다.
    const totalEmployees=allowedIds.size;
    const dailyCounts={};
    filtered.forEach(r=>{
      const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.drank_at));
      dailyCounts[ds] ||= {};
      dailyCounts[ds][r.employee_id]=(dailyCounts[ds][r.employee_id]||0)+1;
    });

    const data=Object.keys(byDay).sort().map(ds=>{
      const short=ds.slice(5).replace('-','.');
      let value=byDay[ds].certs;
      if(metric==='participants') value=byDay[ds].employees.size;
      if(metric==='rate') value=totalEmployees?Math.round(byDay[ds].employees.size/totalEmployees*1000)/10:0;
      return {date:ds,label:short,value};
    });
    renderTrendChart(data,metric,days);
  }catch(e){
    console.error('추이 데이터 조회 실패:',e);
    if(token!==trendRequestToken) return;
    if(box) box.innerHTML=`<div class="trend-empty">추이 데이터를 불러오지 못했습니다.<br><span class="small">${escapeHtml(e.message||e)}</span></div>`;
  }
}

function setTrendDays(days){
  currentTrendDays=Number(days)||14;
  document.querySelectorAll('.trend-tab[data-days]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.days)===currentTrendDays));
  loadAdminTrend();
}
function setTrendMetric(metric){
  currentTrendMetric=metric||'certs';
  document.querySelectorAll('.trend-tab[data-metric]').forEach(btn=>btn.classList.toggle('active',btn.dataset.metric===currentTrendMetric));
  loadAdminTrend();
}

async function deleteAdminRecord(recordId){
  const record = currentAdminRecords.find(r=>r.id===Number(recordId));
  if(!record) return;

  if(!confirm('이 인증 기록을 삭제할까요?\n사진과 인증 기록이 함께 삭제됩니다.')) return;

  const btn=document.querySelector(`[data-delete-id="${recordId}"]`);
  if(btn){btn.disabled=true;btn.textContent='삭제 중...';}

  // DB 기록 삭제
  const {error:deleteError}=await supabaseClient
    .from('water_records')
    .delete()
    .eq('id',Number(recordId));

  if(deleteError){
    alert('기록 삭제 실패: '+deleteError.message);
    if(btn){btn.disabled=false;btn.textContent='삭제';}
    return;
  }

  // Storage 사진도 함께 삭제
  if(record.photo_path){
    const {error:photoError}=await supabaseClient
      .storage.from(PHOTO_BUCKET)
      .remove([record.photo_path]);

    if(photoError){
      // DB 기록은 삭제됐지만 사진 삭제가 실패한 경우 관리자에게 알림
      alert('인증 기록은 삭제됐지만 사진 파일 삭제에 실패했습니다.\n'+photoError.message);
    }
  }

  await adminPage(currentAdminEmployeeId, currentAdminDate, currentAdminCategory, currentAdminDepartment, currentAdminStatus);
}

async function logout(){
 await supabaseClient.auth.signOut();
 currentEmployee=null;currentRecords=[];loginPage();
}

async function boot(){
 const {data:{session}}=await supabaseClient.auth.getSession();

 // Supabase 비밀번호 재설정 링크로 들어온 경우 일반 로그인 화면 대신
 // 새 비밀번호 입력 화면을 보여줍니다.
 if(session) await loadCurrentEmployee(); else loginPage();
}

boot();
</script>
